name: Monthly Optimization

on:
  schedule:
    - cron: '30 2 1 * *'  # 1st of month 08:30 IST = 03:00 UTC
  workflow_dispatch:

jobs:
  monthly_optimization:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Generate Monthly Optimization
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/monthly_optimization.py
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const md = fs.readFileSync(eports/monthly-optimization-.md, 'utf8');
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 📈 Monthly Optimization — ,
              body: md,
              labels: ['monthly', 'optimization', 'approval-needed']
            });
            console.log('Issue created:', data.html_url);
      - name: Commit report JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || git commit -m "📈 Monthly optimization: $(date -u +'%Y-%m-%d')" && git push
