          git add data/email_campaigns.json
          git diff --staged --quiet || git commit -m "📧 Email marketing: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Social Media
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'social_media' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/social_media.py
      
      - name: Commit social media
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'social_media' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social_media.json
          git diff --staged --quiet || git commit -m "📱 Social media: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Affiliate Management
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'affiliate_management' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/affiliate_management.py
      
      - name: Commit affiliate management
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'affiliate_management' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/affiliate_management.json
          git diff --staged --quiet || git commit -m "🤝 Affiliate mgmt: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Customer Support
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'customer_support' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/customer_support.py
      
      - name: Commit customer support
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'customer_support' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/customer_support.json
          git diff --staged --quiet || git commit -m "🎧 Customer support: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Analytics Dashboard
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'analytics_dashboard' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/analytics_dashboard.py
      
      - name: Commit analytics
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'analytics_dashboard' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/analytics.json reports/kpi_history.json
          git diff --staged --quiet || git commit -m "📊 Analytics dashboard: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Contract Review
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'contract_review' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/contract_review.py
      
      - name: Commit contract review
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'contract_review' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contract_review.json
          git diff --staged --quiet || git commit -m "📋 Contract review: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Backup & Recovery
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'backup_recovery' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/backup_recovery.py
      
      - name: Commit backup status
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'backup_recovery' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/backup_status.json
          git diff --staged --quiet || git commit -m "💾 Backup recovery: $(date -u +'%Y-%m-%d')" && git push

      # NEW AGENTS - Zero API, Local Only
      - name: Visual Content
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'visual_content' || github.event_name == 'schedule'
        run: python agents/visual_content.py
      
      - name: Content Calendar
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'content_calendar' || github.event_name == 'schedule'
        run: python agents/content_calendar.py
      
      - name: Manual Post Helper
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'manual_post_helper' || github.event_name == 'schedule'
        run: python agents/manual_post_helper.py
      
      - name: Email Automation
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'email_automation' || github.event_name == 'schedule'
        run: python agents/email_automation.py
      
      - name: Visual Content with Photo
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'visual_content' || github.event_name == 'schedule'
        run: python agents/instagram_poster.py
      
      - name: Commit new agent outputs
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'visual_content' || github.event.inputs.agent == 'content_calendar' || github.event.inputs.agent == 'manual_post_helper' || github.event.inputs.agent == 'email_automation' || github.event.inputs.agent == 'instagram_poster' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/ data/
          git diff --staged --quiet || git commit -m "🎨 Visual/Calendar/Post/Email/IG agents: $(date -u +'%Y-%m-%d')" && git push
      
      # Upload branded images to GitHub for public URLs (continue on error)
      - name: Upload branded images
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'image_uploader' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python agents/image_uploader.py --dir content/daily/${{ github.run_started_at || github.event.schedule }} --method github --output image_urls.json
      
      # Post to Instagram (if configured)
      - name: Post to Instagram
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'instagram_poster' || github.event_name == 'schedule'
        continue-on-error: true
        env:
          IG_APP_ID: ${{ secrets.IG_APP_ID }}
          IG_APP_SECRET: ${{ secrets.IG_APP_SECRET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_LONG_LIVED_TOKEN: ${{ secrets.IG_LONG_LIVED_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Load image URLs
          if [ -f image_urls.json ]; then
            python agents/instagram_post.py --type carousel --images $(cat image_urls.json | jq -r 'to_entries[] | select(.key | endswith(".png")) | .value' | tr '\n' ' ') --caption "$(cat content/daily/$(date -u +%Y-%m-%d)/post_ready.txt | head -200)"
          else
            echo "No image URLs found, skipping Instagram post"
          fi