name: Daily Civilization
on:
  schedule:
    - cron: '0 0 * * *'   # 06:00 IST = 00:30 UTC
    - cron: '30 0 * * *'  # 06:30 IST
    - cron: '0 1 * * *'   # 07:00 IST = 01:30 UTC
    - cron: '30 1 * * *'  # 07:30 IST
    - cron: '0 2 * * *'   # 08:00 IST = 02:30 UTC
    - cron: '30 3 * * *'  # 09:00 IST = 03:30 UTC
    - cron: '0 16 * * *'  # 22:00 IST = 16:30 UTC
  workflow_dispatch:
    inputs:
      agent:
        description: 'Which agent to run'
        required: false
        default: 'all'
        type: choice
        options: [all, market_scan, content_gen, lead_enrich, finance_reconcile, experiment_review, risk_compliance, publishing_ops, email_marketing, social_media, affiliate_management, customer_support, analytics_dashboard, contract_review, backup_recovery, visual_content, content_calendar, manual_post_helper, email_automation, instagram_poster, image_uploader]
jobs:
  daily_civilization:
    if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'market_scan' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      
      - name: Market Scan
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'market_scan' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/market_scan.py
      
      - name: Commit trends
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'market_scan' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends.json
          git diff --staged --quiet || git commit -m "📈 Market scan: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Content Generation
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'content_gen' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/content_gen.py
      
      - name: Commit content
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'content_gen' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git diff --staged --quiet || git commit -m "🎬 Content gen: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Lead Enrichment
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'lead_enrich' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/lead_enrich.py
      
      - name: Commit leads
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'lead_enrich' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/leads.json
          git diff --staged --quiet || git commit -m "👥 Lead enrich: $(date -u +'%Y-%m-%d')" && git push
      
      - name: Finance Reconcile
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'finance_reconcile' || github.event_name == 'schedule'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python agents/finance_reconcile.py
      
      - name: Commit finance
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'finance_reconcile' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/daily-finance.json
