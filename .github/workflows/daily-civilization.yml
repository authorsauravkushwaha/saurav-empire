# Write weekly-report.yml
cat > .github/workflows/weekly-report.yml << 'EOF'
name: Weekly Report
on:
  schedule:
    - cron: '30 1 * * 0'  # Sunday 07:30 IST = 02:00 UTC
  workflow_dispatch:
jobs:
  weekly_report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Generate Weekly Report
        env:
          GROQ_API_KEY: *** secrets.GROQ_API_KEY }}
          HF_TOKEN: *** secrets.HF_TOKEN }}
        run: python agents/weekly_report.py
      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().split('T')[0];
            const md = fs.readFileSync(`reports/weekly/weekly-${date}.md`, 'utf8');
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Weekly Report — ${date}`,
              body: md,
              labels: ['weekly', 'report']
            });
            console.log('Issue created:', data.html_url);
      - name: Commit report JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/weekly/
          git diff --staged --quiet || git commit -m "📊 Weekly report: $(date -u +'%Y-%m-%d')" && git push
