      - name: Commit publishing changes
        if: github.event.inputs.agent == 'all' || github.event.inputs.agent == 'publishing_ops' || github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publishing_changes.json
