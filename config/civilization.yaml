      - { id: customer-success,      name: Customer Success,       shape: block, pos: [0, 16],    size: [14, 14, 14], slots: 20, purpose: "Delivery, retention, referral, outcome tracking" }
      - { id: partnerships,          name: Partnerships,           shape: dome,  pos: [28, 16],   size: [14, 14, 14], slots: 12, purpose: "Leverage, BATNA, deal structure, terms review" }
