      - { id: data-engineering,      name: Data Engineering,       shape: block, pos: [26, -18],  size: [14, 14, 14], slots: 18, purpose: "Pipelines, schemas, warehouse, event streams" }
      - { id: devops,                name: DevOps,                 shape: block, pos: [-26, 20],  size: [12, 16, 12], slots: 14, purpose: "Local deployment, supervision, backups, health" }
      - { id: cybersecurity,         name: Cybersecurity,          shape: tower, pos: [26, 20],   size: [12, 24, 12], slots: 14, purpose: "Least privilege, secrets, sandboxing, audit" }
      - { id: automation-engineering,name: Automation Engineering,  shape: block, pos: [0, -46],   size: [14, 12, 14], slots: 16, purpose: "Turn proven manual workflows into automation" }
      - { id: qa-lab,                name: QA Laboratory,          shape: lab,   pos: [0, 46],    size: [16, 10, 16], slots: 16, purpose: "Verification of every artifact before it ships" }

