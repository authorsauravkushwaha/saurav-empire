# SAURAV AI CIVILIZATION — World definition
# Real backend state drives this world. Nothing here is decorative-only:
# every building maps to departments/agents, every agent maps to real tasks.
version: "1.0"
world:
  name: "Saurav AI Civilization"
  seed: 20260925
  ground_size: 900          # world units
  city_ring_radius: 230     # non-command cities orbit the command city (spaced so discs never touch)
  ambient: dusk             # dusk | day | night
  grid_units: 5

# ---------------------------------------------------------------------------
# CITIES (9). Command City sits at the centre; the other eight ring around it.
# `pos` is the city origin in world space [x, z].
# ---------------------------------------------------------------------------
cities:
  - id: command
    name: Command City
    tagline: "Central control. The owner's authority is the only authority."
    theme: "#7c5cff"
    pos: [0, 0]
    radius: 62
    buildings:
      - { id: owner-command-center,  name: Owner Command Center,   shape: tower, pos: [0, 0],      size: [14, 34, 14], slots: 24, purpose: "Owner console, natural-language command, global overrides, kill switch" }
      - { id: ai-council,            name: AI Council,             shape: dome,  pos: [-26, -14],  size: [16, 16, 16], slots: 12, purpose: "8-MIND decision engine, chairman verdicts, conflict resolution" }
      - { id: agent-registry,        name: Agent Registry,         shape: block, pos: [26, -14],   size: [12, 12, 12], slots: 10, purpose: "Agent identity, lifecycle, rank, certification records" }
      - { id: security-center,       name: Security Center,        shape: tower, pos: [-30, 18],   size: [12, 22, 12], slots: 12, purpose: "Kill switch, permission audits, prompt-injection defence" }
      - { id: analytics-tower,       name: Analytics Tower,        shape: tower, pos: [0, -40],    size: [12, 30, 12], slots: 14, purpose: "KPI, department efficiency, agent productivity" }
      - { id: mission-control,       name: Mission Control,        shape: block, pos: [30, 18],    size: [14, 14, 14], slots: 16, purpose: "Task queues, scheduling, workflow orchestration" }
      - { id: memory-archive,        name: Memory Archive,         shape: block, pos: [-14, 40],   size: [14, 16, 14], slots: 8,  purpose: "Six memory layers, provenance, owner-inspectable records" }
      - { id: economic-command,      name: Economic Control Center,shape: dome,  pos: [14, 40],    size: [16, 18, 16], slots: 14, purpose: "Runway, revenue, cash-flow, SCALE/KILL rulings" }
      - { id: automation-control,    name: Automation Control Room,shape: block, pos: [44, 0],     size: [12, 12, 12], slots: 10, purpose: "Workflow automation registry, scheduled loops" }

  - id: knowledge
    name: Knowledge City
    tagline: "Where agents are made. Recruit → Test → Educate → Certify → Employ."
    theme: "#38bdf8"
    pos: [230, 0]
    buildings:
      - { id: ai-university,         name: AI University,          shape: dome,  pos: [0, 0],     size: [20, 20, 20], slots: 60, purpose: "Foundational curriculum, exams, graduation" }
      - { id: programming-academy,   name: Programming Academy,    shape: block, pos: [-28, -18], size: [14, 12, 14], slots: 24, purpose: "Python, TypeScript, SQL, systems literacy" }
      - { id: business-academy,      name: Business Academy,       shape: block, pos: [28, -18],  size: [14, 12, 14], slots: 24, purpose: "Strategy, markets, unit economics, positioning" }
      - { id: marketing-academy,     name: Marketing Academy,      shape: block, pos: [-28, 20],  size: [14, 12, 14], slots: 20, purpose: "Positioning, distribution, ethical persuasion" }
      - { id: finance-academy,       name: Finance Academy,        shape: block, pos: [28, 20],   size: [14, 12, 14], slots: 20, purpose: "Margins, CAC/LTV, scenarios, cash discipline" }
      - { id: research-lab,          name: Research Laboratory,    shape: lab,   pos: [0, -46],   size: [16, 10, 16], slots: 18, purpose: "Methodology, evidence hierarchy, source quality" }
      - { id: simulation-lab,        name: Simulation Laboratory,  shape: lab,   pos: [0, 46],    size: [16, 10, 16], slots: 18, purpose: "Sandboxed experiments before external action" }

  - id: engineering
