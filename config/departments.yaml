# SAURAV AI CIVILIZATION — Department seed roster
# There is NO hard-coded maximum department count. This file only defines the
# starting organization; `Department Factory` can create more at runtime
# (subdepartments, projects, teams, squads) with boss auto-naming + de-duplication.
version: "1.0"

